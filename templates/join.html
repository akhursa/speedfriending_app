<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Speed Friending Event</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="nickname"] {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]::placeholder,
        input[type="nickname"]::placeholder {
            color: #bbb;
        }

        input[type="text"]:focus,
        input[type="nickname"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-note {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #1565c0;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 25px 0;
            position: relative;
        }

        .divider::after {
            content: "or";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 8px;
            color: #999;
            font-size: 12px;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            text-align: center;
            width: 100%;
            margin-top: 20px;
            font-size: 14px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input.error {
            border-color: #c62828;
            background-color: #ffebee;
        }

        .highlight {
            background: #fff3cd;
            border-left: 4px solid #ff9800;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .highlight strong {
            color: #333;
        }

        .success-message {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤝</div>
            <h1>Join Event</h1>
            <p>Enter your details to join the speed friending event</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="joinForm">
            <div class="form-group">
                <label for="joinCode">Event Code</label>
                <input 
                    type="text" 
                    id="joinCode" 
                    name="join_code" 
                    placeholder="e.g., ABC123"
                    maxlength="10"
                    required
                    autocomplete="off"
                >
                <div class="form-note">You should have received this from the facilitator</div>
            </div>

            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input 
                    type="nickname" 
                    id="nickname" 
                    name="nickname" 
                    placeholder="SunnySun"
                    required
                    autocomplete="nickname"
                >
                <div class="form-note">We'll use this to match you with other participants</div>
            </div>

            <button type="submit" class="btn-primary" id="joinBtn">
                <div class="btn-content">
                    <span id="btnText">Join Event</span>
                </div>
            </button>
        </form>

    </div>

    <script>
        const API_BASE = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');

        // Pre-fill join code if provided in URL
        if (codeFromUrl) {
            document.getElementById('joinCode').value = codeFromUrl.toUpperCase();
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show alert-${type}`;
        }

        function clearAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('show');
        }

        function validateNickname(nickname) {
            const re = /^[a-zA-Z0-9_]{3,20}$/;
            return re.test(nickname);
        }

        function validateJoinCode(code) {
            return code.trim().length >= 4 && code.trim().length <= 10;
        }

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const joinCode = document.getElementById('joinCode').value.trim().toUpperCase();
            const nickname = document.getElementById('nickname').value.trim();

            // Validation
            if (!validateJoinCode(joinCode)) {
                showAlert('Please enter a valid event code (4-10 characters)', 'error');
                document.getElementById('joinCode').classList.add('error');
                return;
            }

            if (!validateNickname(nickname)) {
                showAlert('Please enter a valid nickname (5-20 characters, alphanumeric and underscore only)', 'error');
                document.getElementById('nickname').classList.add('error');
                return;
            }

            // Remove error styling
            document.getElementById('joinCode').classList.remove('error');
            document.getElementById('nickname').classList.remove('error');

            const btn = document.getElementById('joinBtn');
            const btnText = document.getElementById('btnText');
            const originalText = btnText.textContent;
            
            btn.disabled = true;
            btnText.innerHTML = '<div class="loading"></div>Joining...';

            try {
                // First, verify the event exists
                const eventCheckResponse = await fetch(`${API_BASE}/events/${joinCode}/state`);
                
                if (!eventCheckResponse.ok) {
                    if (eventCheckResponse.status === 404) {
                        throw new Error('Event not found. Please check the event code.');
                    }
                    throw new Error('Failed to verify event');
                }

                // Join the event
                const joinResponse = await fetch(`${API_BASE}/events/${joinCode}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname })
                });

                if (!joinResponse.ok) {
                    const error = await joinResponse.json();
                    throw new Error(error.detail || 'Failed to join event');
                }

                const participantData = await joinResponse.json();

                // Success! Store the nickname and redirect
                sessionStorage.setItem('current_nickname', nickname);
                sessionStorage.setItem('current_join_code', joinCode);

                // Redirect to participant view after a brief delay
                setTimeout(() => {
                    window.location.href = `/events/${joinCode}/participant_view?nickname=${encodeURIComponent(nickname)}`;
                }, 800);

            } catch (error) {
                showAlert(error.message || 'Failed to join event. Please try again.', 'error');
                btn.disabled = false;
                btnText.textContent = originalText;
            }
        });

        // Clear error styling on input
        document.getElementById('joinCode').addEventListener('input', function() {
            this.classList.remove('error');
        });

        document.getElementById('nickname').addEventListener('input', function() {
            this.classList.remove('error');
        });
    </script>
</body>
</html>
