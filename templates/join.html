<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Speed Friending Event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Albert Sans', -apple-system, sans-serif;
            background: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        /* Decorative orange circle — top-left corner, partially visible.
           left = body-padding(20px) + Figma-x(39px) = 59px on mobile.
           On wider viewports content is centered: 50vw - (375/2) + 39 = 50vw - 148.5px */
        .deco-circle {
            position: fixed;
            top: -36px;
            left: max(59px, calc(50vw - 148.5px));
            width: 100px;
            height: 100px;
            background: #FF9A00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            width: 100%;
            max-width: 375px;
            padding: 0 20px;
            z-index: 1;
        }

        /* People icon centered, overlapping card top */
        .logo-mark {
            display: flex;
            justify-content: center;
            margin-bottom: clamp(12px, 4vh, 40px);
            position: relative;
            z-index: 10;
        }

        .logo-mark img {
            width: clamp(44px, 8vh, 80px);
        }

        /* Main card */
        .card {
            background: white;
            border: 1px solid #c82901;
            border-radius: 31px;
            padding: clamp(24px, 5vh, 48px) 28px clamp(20px, 4vh, 40px);
            position: relative;
        }

        .card-title {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 600;
            color: rgba(0, 0, 0, 0.7);
            text-align: center;
            margin-bottom: clamp(4px, 1vh, 10px);
            line-height: 1.2;
        }

        .card-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-bottom: clamp(12px, 3vh, 28px);
            line-height: 1.5;
        }

        /* Alerts */
        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fff0ee;
            color: #c82901;
            border-left: 3px solid #c82901;
        }

        .alert-info {
            background: #fff5e6;
            color: #c05000;
            border-left: 3px solid #ff9a00;
        }

        /* Form */
        .form-group {
            margin-bottom: clamp(8px, 2vh, 18px);
        }

        input[type="text"] {
            display: block;
            width: 100%;
            height: clamp(44px, 7vh, 57px);
            padding: 0 20px;
            border: 0.5px solid #c82901;
            border-radius: 30px;
            font-family: 'Albert Sans', sans-serif;
            font-size: clamp(16px, 2.5vw, 20px);
            font-weight: 600;
            color: rgba(0, 0, 0, 0.7);
            background: white;
            outline: none;
            transition: border-width 0.15s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(0, 0, 0, 0.25);
            font-weight: 600;
        }

        input[type="text"]:focus {
            border-width: 1.5px;
        }

        input[type="text"].error {
            border-color: #c82901;
            border-width: 1.5px;
            background: #fff8f7;
        }

        .form-note {
            font-size: 12px;
            font-weight: 400;
            color: rgba(0, 0, 0, 0.6);
            margin-top: 8px;
            padding-left: 12px;
        }

        /* Primary button */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(75%, 239px);
            height: clamp(44px, 7vh, 57px);
            margin: clamp(12px, 3vh, 24px) auto 0;
            background: linear-gradient(90deg, #ff9a00 0%, #c82901 100%);
            border: none;
            border-radius: 184px;
            font-family: 'Albert Sans', sans-serif;
            font-size: clamp(18px, 2.8vw, 22px);
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(200, 41, 1, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Divider */
        .divider {
            height: 1px;
            background: rgba(200, 41, 1, 0.15);
            margin: clamp(12px, 2.5vh, 28px) 0;
        }

        /* Photo / camera section */
        .photo-section {
            display: none;
        }

        .photo-section.active {
            display: block;
            animation: fadeUp 0.4s ease-out;
        }

        .photo-section-header {
            text-align: center;
            margin-bottom: clamp(8px, 1.5vh, 20px);
        }

        .photo-section-header h2 {
            font-size: clamp(17px, 2.8vw, 22px);
            font-weight: 600;
            color: rgba(0, 0, 0, 0.7);
            margin-bottom: 6px;
        }

        .photo-section-header p {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.5);
        }

        .photo-note {
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            margin-bottom: clamp(8px, 1.5vh, 18px);
        }

        .camera-container {
            position: relative;
            width: clamp(130px, 24vh, 200px);
            height: clamp(130px, 24vh, 200px);
            margin: 0 auto clamp(10px, 2vh, 20px);
            border-radius: 50%;
            overflow: hidden;
            background: #fff5e6;
            border: 3px dashed rgba(200, 41, 1, 0.3);
        }

        .camera-container.has-photo {
            border-style: solid;
            border-color: #c82901;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #photoCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: rgba(0, 0, 0, 0.3);
            gap: 8px;
        }

        .photo-placeholder-icon {
            font-size: 40px;
        }

        .photo-placeholder span {
            font-size: 13px;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .btn-camera {
            background: linear-gradient(90deg, #ff9a00, #c82901);
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-family: 'Albert Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-camera:hover:not(:disabled) {
            opacity: 0.88;
        }

        .btn-camera:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-camera.btn-secondary {
            background: white;
            color: #c82901;
            border: 1.5px solid #c82901;
        }

        .btn-camera.btn-secondary:hover {
            background: #fff5e6;
        }

        .btn-skip {
            display: block;
            background: transparent;
            color: rgba(0, 0, 0, 0.45);
            border: none;
            text-decoration: underline;
            font-family: 'Albert Sans', sans-serif;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            margin: 8px auto 0;
            padding: 8px 16px;
        }

        .btn-skip:hover {
            color: rgba(0, 0, 0, 0.65);
        }

        .upload-status {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            min-height: 20px;
        }

        .upload-status.success {
            color: #2a7a32;
        }

        .upload-status.error {
            color: #c82901;
        }

        @media (max-height: 700px) {
            .form-note {
                font-size: 11px;
                margin-top: 5px;
            }

            .camera-controls {
                gap: 8px;
            }

            .btn-camera {
                padding: 8px 16px;
                font-size: 13px;
            }

            .upload-status {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative orange circle blob (top-left, partially clipped) -->
    <div class="deco-circle"></div>

    <div class="page-wrapper">

        <!-- People icon centered above the card -->
        <div class="logo-mark">
            <img src="/static/images/logo.svg" alt="Speed Friending">
        </div>

        <!-- Main card -->
        <div class="card">
            <h1 class="card-title">Join Event</h1>
            <p class="card-subtitle">Enter your details to join the Speed Friending event</p>

            <div id="alertBox" class="alert"></div>

            <form id="joinForm">
                <div class="form-group">
                    <input type="text" id="joinCode" name="join_code" placeholder="Event code" maxlength="10" required
                        autocomplete="off">
                    <div class="form-note">You should have received it from your facilitator</div>
                </div>

                <div class="form-group">
                    <input type="text" id="nickname" name="nickname" placeholder="Your Nickname" required
                        autocomplete="off">
                    <div class="form-note">We'll use it to match you with other participants</div>
                </div>

                <button type="submit" class="btn-primary" id="joinBtn">
                    <span id="btnText">Join Event</span>
                </button>
            </form>

            <!-- Photo section — shown after successful join -->
            <div class="photo-section" id="photoSection">
                <div class="divider"></div>

                <div class="photo-section-header">
                    <h2>Take a Selfie</h2>
                    <p>Add a photo so others can recognize you</p>
                </div>

                <div class="photo-note">Optional — you can skip if you prefer</div>

                <div class="camera-container" id="cameraContainer">
                    <video id="videoElement" autoplay playsinline style="display: none;"></video>
                    <canvas id="photoCanvas" style="display: none;"></canvas>
                    <div class="photo-placeholder" id="photoPlaceholder">
                        <div class="photo-placeholder-icon">📷</div>
                        <span>No photo yet</span>
                    </div>
                </div>

                <div class="camera-controls" id="cameraControls">
                    <button type="button" class="btn-camera" id="startCameraBtn">📷 Take Photo</button>
                </div>

                <div class="camera-controls" id="retakeControls" style="display: none;">
                    <button type="button" class="btn-camera btn-secondary" id="retakeBtn">↺ Retake</button>
                    <button type="button" class="btn-camera" id="usePhotoBtn">✓ Use This Photo</button>
                </div>

                <div class="upload-status" id="uploadStatus"></div>

                <button type="button" class="btn-skip" id="skipPhotoBtn">Skip for now</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');

        let currentJoinCode = '';
        let currentNickname = '';
        let stream = null;
        let capturedPhoto = null;

        // Auto-redirect if user has a saved session
        async function checkSavedSession() {
            const saved = localStorage.getItem('speedfriending_participant');
            if (saved) {
                try {
                    const { nickname, joinCode } = JSON.parse(saved);
                    if (nickname && joinCode) {
                        document.body.innerHTML = `
                            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                                        height:100vh;background:#fff;font-family:'Albert Sans',sans-serif;color:rgba(0,0,0,0.6);">
                                <img src="/static/images/logo-circle.svg" style="width:80px;margin-bottom:24px;" alt="">
                                <div style="font-size:18px;font-weight:600;color:rgba(0,0,0,0.7);">Returning to your session…</div>
                            </div>`;
                        try {
                            const response = await fetch(`${API_BASE}/events/${joinCode}/state`);
                            if (response.ok) {
                                const state = await response.json();
                                if (state.phase === 'ended' || state.status === 'ended') {
                                    localStorage.removeItem('speedfriending_participant');
                                } else {
                                    window.location.href = `/events/${joinCode}/participant_view?nickname=${encodeURIComponent(nickname)}`;
                                    return true;
                                }
                            }
                        } catch (e) {
                            localStorage.removeItem('speedfriending_participant');
                        }
                    }
                } catch (e) {
                    localStorage.removeItem('speedfriending_participant');
                }
            }
            return false;
        }

        checkSavedSession().then(shouldSkip => {
            if (codeFromUrl) {
                document.getElementById('joinCode').value = codeFromUrl.toUpperCase();
            }
        });

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show alert-${type}`;
        }

        function clearAlert() {
            document.getElementById('alertBox').classList.remove('show');
        }

        function validateNickname(nickname) {
            return /^[a-zA-Z0-9_]{3,20}$/.test(nickname);
        }

        function validateJoinCode(code) {
            return code.trim().length >= 4 && code.trim().length <= 10;
        }

        // Camera functions
        async function startCamera() {
            const video = document.getElementById('videoElement');
            const container = document.getElementById('cameraContainer');
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('photoPlaceholder').style.display = 'none';
                document.getElementById('photoCanvas').style.display = 'none';
                container.classList.add('has-photo');
                document.getElementById('cameraControls').style.display = 'none';
                document.getElementById('retakeControls').style.display = 'flex';
            } catch (err) {
                showAlert('Could not access camera. Please allow camera permissions or skip this step.', 'error');
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('photoCanvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.transform(-1, 0, 0, 1, canvas.width, 0);
            ctx.drawImage(video, 0, 0);
            capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
            video.style.display = 'none';
            canvas.style.display = 'block';
            stopCamera();
            document.getElementById('cameraControls').style.display = 'none';
            document.getElementById('retakeControls').style.display = 'flex';
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        }

        function retakePhoto() {
            capturedPhoto = null;
            document.getElementById('photoCanvas').style.display = 'none';
            document.getElementById('videoElement').style.display = 'block';
            document.getElementById('cameraControls').style.display = 'flex';
            document.getElementById('retakeControls').style.display = 'none';
            document.getElementById('uploadStatus').textContent = '';
            startCamera();
        }

        async function uploadPhoto() {
            if (!capturedPhoto) return false;
            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.textContent = 'Uploading photo…';
            uploadStatus.className = 'upload-status';
            try {
                const base64Data = capturedPhoto.split(',')[1];
                const blob = await fetch(`data:image/jpeg;base64,${base64Data}`).then(r => r.blob());
                const formData = new FormData();
                formData.append('photo', blob, 'selfie.jpg');
                const response = await fetch(
                    `${API_BASE}/events/${currentJoinCode}/upload_photo?nickname=${encodeURIComponent(currentNickname)}`,
                    { method: 'POST', body: formData }
                );
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to upload photo');
                }
                uploadStatus.textContent = 'Photo uploaded!';
                uploadStatus.className = 'upload-status success';
                return true;
            } catch (err) {
                uploadStatus.textContent = 'Failed to upload photo. You can continue without it.';
                uploadStatus.className = 'upload-status error';
                return false;
            }
        }

        async function proceedToEvent() {
            if (capturedPhoto) await uploadPhoto();
            setTimeout(() => {
                window.location.href = `/events/${currentJoinCode}/participant_view?nickname=${encodeURIComponent(currentNickname)}`;
            }, 500);
        }

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const joinCode = document.getElementById('joinCode').value.trim().toUpperCase();
            const nickname = document.getElementById('nickname').value.trim();

            if (!validateJoinCode(joinCode)) {
                showAlert('Please enter a valid event code (4–10 characters)', 'error');
                document.getElementById('joinCode').classList.add('error');
                return;
            }
            if (!validateNickname(nickname)) {
                showAlert('Nickname must be 3–20 characters (letters, numbers, underscore only)', 'error');
                document.getElementById('nickname').classList.add('error');
                return;
            }

            document.getElementById('joinCode').classList.remove('error');
            document.getElementById('nickname').classList.remove('error');

            const btn = document.getElementById('joinBtn');
            const btnText = document.getElementById('btnText');
            const origTxt = btnText.textContent;

            btn.disabled = true;
            btnText.innerHTML = '<div class="loading"></div>Joining…';

            try {
                const eventCheck = await fetch(`${API_BASE}/events/${joinCode}/state`);
                if (!eventCheck.ok) {
                    throw new Error(eventCheck.status === 404
                        ? 'Event not found. Please check the event code.'
                        : 'Failed to verify event');
                }

                const joinRes = await fetch(`${API_BASE}/events/${joinCode}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname })
                });
                if (!joinRes.ok) {
                    const error = await joinRes.json();
                    throw new Error(error.detail || 'Failed to join event');
                }

                currentJoinCode = joinCode;
                currentNickname = nickname;
                localStorage.setItem('speedfriending_participant', JSON.stringify({ nickname, joinCode }));

                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('photoSection').classList.add('active');
                setTimeout(startCamera, 500);

            } catch (error) {
                showAlert(error.message || 'Failed to join event. Please try again.', 'error');
                btn.disabled = false;
                btnText.textContent = origTxt;
            }
        });

        document.getElementById('startCameraBtn').addEventListener('click', startCamera);
        document.getElementById('retakeBtn').addEventListener('click', retakePhoto);
        document.getElementById('usePhotoBtn').addEventListener('click', () => { capturePhoto(); stopCamera(); proceedToEvent(); });
        document.getElementById('skipPhotoBtn').addEventListener('click', () => { stopCamera(); proceedToEvent(); });

        document.getElementById('joinCode').addEventListener('input', function () { this.classList.remove('error'); });
        document.getElementById('nickname').addEventListener('input', function () { this.classList.remove('error'); });

        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>

</html>
